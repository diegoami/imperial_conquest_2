name: Refresh observer recordings
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Excerpt seconds per scenario (5–180; normal refresh 180)'
        default: '180'
        required: true
  # Owner 2026-11-08: one YouTube pilot first. Recurring publication stays
  # disabled until the pilot is reviewed and matching full-campaign links exist.
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: observer-recordings-pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GODOT_VERSION: '4.7.2-stable'
      GH_TOKEN: ${{ github.token }}
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install capture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg libgl1-mesa-dri
          curl --fail -sSL --retry 3 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          dir="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_mono_linux_x86_64"
          chmod +x "$dir/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          ln -s "$dir/Godot_v${GODOT_VERSION}_mono_linux.x86_64" "$dir/godot"
          echo "$dir" >> "$GITHUB_PATH"
      - name: Validate recording/playlist contracts
        run: node --test tests/web/observer-media.test.mjs
      - name: Capture and validate rotating production campaigns
        env:
          CLIP_SECONDS: ${{ inputs.seconds || '180' }}
        run: xvfb-run -a -s '-screen 0 1920x1080x24' node scripts/record-observers.mjs --out=rendered/observer-batch --seconds="$CLIP_SECONDS"
      - name: Preserve capture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observer-capture-diagnostics
          path: |
            rendered/observer-batch/**/*.log
            rendered/observer-batch/**/*.json
          if-no-files-found: ignore
      - name: Publish only the complete validated generation
        run: node scripts/publish-observers.mjs --batch=rendered/observer-batch --site=rendered/observer-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: rendered/observer-site
      - name: Deploy the validated playlist
        id: deployment
        uses: actions/deploy-pages@v4
