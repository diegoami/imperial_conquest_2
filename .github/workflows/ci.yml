name: CI

# T01 (docs/task-catalogue.md "Build scaffolding and CI"): restore, build and test
# IC2.sln on every push and pull request. The build-and-test job never references
# godot/IC2.MapViewer.csproj; the godot-headless job below (2026-09-28) downloads the Godot 4.7.2
# .NET editor and runs the project's headless checks, so the Godot lane is checked by CI and not
# only by a reviewer's machine and the user's visual sign-off.

on:
  # push only on main: a PR from a same-repo branch would otherwise run twice on
  # the same SHA (repo-audit-2026-09-18.md §4.6).
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Follow-up #382 N12: a hang guard, since removing the repeat check in
    # GameSession.PlayUntilOneFullLapOrRepeat means a stalled AI soak would hang the suite instead of
    # failing it, and this workflow otherwise falls back to GitHub Actions' own 360-minute default.
    # 20 minutes is generous headroom over the slowest green run found. Review round 1, N5: the
    # original measurement used --limit 20, not enough runs to find the true recent slowest; re-run
    # over the last 100 (gh run list --workflow ci.yml --limit 100 --json databaseId,conclusion,createdAt,updatedAt)
    # on 2026-09-26, the slowest is run 36067155996 (2026-09-24T22:23:33Z -> 2026-09-24T22:25:35Z),
    # 122 seconds -- run 36178858807 (110 seconds) is second. Still under 2.5 minutes, so 20 minutes
    # is still roughly 10x that, not a bound tuned to one sample.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore IC2.sln

      - name: Build
        run: dotnet build IC2.sln --no-restore --configuration Release

      # T53 (issue #204, corrected by #207): the private diegoami/ic2-test-fixtures repo holds the DAT
      # and the whole 54-save corpus IC2.Data.Tests reads (7 MB) - not a named subset; see that repo's
      # own README for why. FIXTURES_TOKEN is a repository secret, read-only and scoped to that one
      # repository alone. A fork PR receives no repository secrets (GitHub's own protection -
      # FIXTURES_TOKEN would be empty), so this step is guarded to skip there rather than fail: the
      # suite still runs and still passes, it just skips the asset-dependent tests exactly as an
      # unconfigured machine does today, and FixtureResolutionTests (Done-when line 2) says so plainly
      # rather than letting that vanish as an unexplained skip. A workflow that fails on every outside
      # contribution would be worse than one that skips (Done-when line 5).
      #
      # The token is never echoed (Done-when line 6): it is passed only as a one-shot HTTP
      # Authorization header via `-c http.extraheader`, scoped to this single `git clone` invocation,
      # and never embedded in the clone URL. A URL-embedded credential is exactly what would otherwise
      # risk appearing in git's own diagnostic output (e.g. `git remote -v`, a redirect, or a failed
      # clone's own error naming the remote) - the header form does not get echoed by git on success
      # or failure. It is ALSO explicitly masked with ::add-mask:: below: Actions only auto-masks the
      # exact registered secret value, not a transformation of it (here, its base64 encoding) - a
      # failed clone was confirmed to print only "remote: Invalid username or token" and a bare URL,
      # never the header, but the explicit mask covers the base64 form too rather than relying on that.
      #
      # After the clone, `test -f` asserts the DAT actually landed - independent, workflow-side belt
      # and braces alongside FixtureResolutionTests' own non-skippable check: a fixtures repo that
      # clones successfully into a directory the resolver still can't use (a layout change, an empty
      # or partial clone) fails loudly here instead of silently downgrading CI to the unconfigured
      # 36-passed/90-skipped shape - exactly the failure mode issue #203 was about.
      - name: Fetch test fixtures
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        env:
          FIXTURES_TOKEN: ${{ secrets.FIXTURES_TOKEN }}
        run: |
          set -eu
          dir="${RUNNER_TEMP}/ic2-test-fixtures"
          auth="$(printf 'x-access-token:%s' "$FIXTURES_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
            clone --depth 1 https://github.com/diegoami/ic2-test-fixtures.git "$dir"
          test -f "$dir/Imperial Conquest 2.dat"
          echo "IC2_FIXTURES_DIR=$dir" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test IC2.sln --no-build --configuration Release --logger "console;verbosity=detailed"

  # The Godot lane in CI (2026-09-28, item 5 of the process review). Runs what T24's and T25's
  # Done-when lines run locally: the main scene headless (T24 DoD 1), one order of each type through
  # the command layer (T24 DoD 2, OrderCoverageCheck), the New Game ruleset chooser (T24 DoD 4,
  # RulesetFlowCheck), the three T25 screens (ScreensCheck), and the churn guard (T24 DoD 3). Each check
  # scene quits with its own exit code, so a failing assertion fails the step. Each step also requires
  # the scene's own "exiting with code 0" line in the output (review of PR #477, Luna R1 and Opus N1):
  # Godot exits 0 when --quit-after fires, so a scene that never reached _Ready, or outgrew its frame
  # budget, would otherwise pass silently. The budget is a generous watchdog for the same reason. The
  # screenshot tours are not run: the headless driver has no texture to capture (operating-guide.md,
  # Practical caveats). T95's SaveResumeCheck gets its own step here once it merges.
  #
  # The editor binary comes from the godotengine/godot release, cached by version. It is the .NET
  # ("mono") build, whose GodotSharp/ directory must sit next to the binary, so the zip's folder is
  # kept whole and a symlink named godot is put on PATH. The C# assembly is built with dotnet first:
  # Godot.NET.Sdk writes it where the editor loads it from (.godot/mono/temp/bin/Debug), and a project
  # run outside the editor does not build it itself. `--import` then imports the resources once, so the
  # first real run does not spend its --quit-after frames importing.
  godot-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache the Godot editor
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64

      - name: Download the Godot .NET editor
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          mkdir -p "$HOME/godot"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$HOME/godot"

      - name: Put godot on PATH
        run: |
          set -eu
          dir="$HOME/godot/Godot_v${GODOT_VERSION}_mono_linux_x86_64"
          bin="$dir/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          test -f "$bin"
          chmod +x "$bin"
          ln -sf "$bin" "$dir/godot"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Godot version
        run: godot --version

      - name: Build the Godot project
        run: dotnet build godot/IC2.MapViewer.csproj --configuration Debug

      - name: Import resources
        run: godot --headless --path godot --import

      - name: T24 DoD 1, the main scene runs headless
        run: |
          set -eo pipefail
          godot --headless --path godot --quit-after 2 2>&1 | tee "$RUNNER_TEMP/main-scene.txt"
          ! grep -q 'SCRIPT ERROR' "$RUNNER_TEMP/main-scene.txt"

      - name: T24 DoD 2, one order of each type through the command layer
        run: |
          set -eo pipefail
          godot --headless --path godot res://Checks/OrderCoverageCheck.tscn --quit-after 600 2>&1 | tee "$RUNNER_TEMP/order-coverage.txt"
          grep -q 'OrderCoverageCheck: exiting with code 0.' "$RUNNER_TEMP/order-coverage.txt"

      - name: T24 DoD 4, the New Game ruleset chooser
        run: |
          set -eo pipefail
          godot --headless --path godot res://Checks/RulesetFlowCheck.tscn --quit-after 600 2>&1 | tee "$RUNNER_TEMP/ruleset-flow.txt"
          grep -q 'RulesetFlowCheck: exiting with code 0.' "$RUNNER_TEMP/ruleset-flow.txt"

      - name: T25, the three screens open from a scripted state
        run: |
          set -eo pipefail
          godot --headless --path godot res://Screens/Checks/ScreensCheck.tscn --quit-after 600 2>&1 | tee "$RUNNER_TEMP/screens.txt"
          grep -q 'ScreensCheck: exiting with code 0.' "$RUNNER_TEMP/screens.txt"

      - name: T24 DoD 3, no headless churn left in the tree
        run: pwsh scripts/check-godot-churn.ps1
