name: CI

# T01 (docs/task-catalogue.md "Build scaffolding and CI"): restore, build and test
# IC2.sln on every push and pull request. This job intentionally never references
# godot/IC2.MapViewer.csproj - it requires the Godot 4.7.2 .NET SDK, which is not installed on
# GitHub-hosted runners and cannot build here. See IC2.sln's header comment and docs/operating-guide.md
# section 6 for the Godot-headless-run caveat that scripts/check-godot-churn.ps1 guards against locally;
# that script is not invoked by this workflow because no step here runs Godot.

on:
  # push only on main: a PR from a same-repo branch would otherwise run twice on
  # the same SHA (repo-audit-2026-09-18.md §4.6).
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Follow-up #382 N12: a hang guard, since removing the repeat check in
    # GameSession.PlayUntilOneFullLapOrRepeat means a stalled AI soak would hang the suite instead of
    # failing it, and this workflow otherwise falls back to GitHub Actions' own 360-minute default.
    # 20 minutes is generous headroom over the slowest green run found. Review round 1, N5: the
    # original measurement used --limit 20, not enough runs to find the true recent slowest; re-run
    # over the last 100 (gh run list --workflow ci.yml --limit 100 --json databaseId,conclusion,createdAt,updatedAt)
    # on 2026-09-26, the slowest is run 36067155996 (2026-09-24T22:23:33Z -> 2026-09-24T22:25:35Z),
    # 122 seconds -- run 36178858807 (110 seconds) is second. Still under 2.5 minutes, so 20 minutes
    # is still roughly 10x that, not a bound tuned to one sample.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore IC2.sln

      - name: Build
        run: dotnet build IC2.sln --no-restore --configuration Release

      # T53 (issue #204, corrected by #207): the private diegoami/ic2-test-fixtures repo holds the DAT
      # and the whole 54-save corpus IC2.Data.Tests reads (7 MB) - not a named subset; see that repo's
      # own README for why. FIXTURES_TOKEN is a repository secret, read-only and scoped to that one
      # repository alone. A fork PR receives no repository secrets (GitHub's own protection -
      # FIXTURES_TOKEN would be empty), so this step is guarded to skip there rather than fail: the
      # suite still runs and still passes, it just skips the asset-dependent tests exactly as an
      # unconfigured machine does today, and FixtureResolutionTests (Done-when line 2) says so plainly
      # rather than letting that vanish as an unexplained skip. A workflow that fails on every outside
      # contribution would be worse than one that skips (Done-when line 5).
      #
      # The token is never echoed (Done-when line 6): it is passed only as a one-shot HTTP
      # Authorization header via `-c http.extraheader`, scoped to this single `git clone` invocation,
      # and never embedded in the clone URL. A URL-embedded credential is exactly what would otherwise
      # risk appearing in git's own diagnostic output (e.g. `git remote -v`, a redirect, or a failed
      # clone's own error naming the remote) - the header form does not get echoed by git on success
      # or failure. It is ALSO explicitly masked with ::add-mask:: below: Actions only auto-masks the
      # exact registered secret value, not a transformation of it (here, its base64 encoding) - a
      # failed clone was confirmed to print only "remote: Invalid username or token" and a bare URL,
      # never the header, but the explicit mask covers the base64 form too rather than relying on that.
      #
      # After the clone, `test -f` asserts the DAT actually landed - independent, workflow-side belt
      # and braces alongside FixtureResolutionTests' own non-skippable check: a fixtures repo that
      # clones successfully into a directory the resolver still can't use (a layout change, an empty
      # or partial clone) fails loudly here instead of silently downgrading CI to the unconfigured
      # 36-passed/90-skipped shape - exactly the failure mode issue #203 was about.
      - name: Fetch test fixtures
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        env:
          FIXTURES_TOKEN: ${{ secrets.FIXTURES_TOKEN }}
        run: |
          set -eu
          dir="${RUNNER_TEMP}/ic2-test-fixtures"
          auth="$(printf 'x-access-token:%s' "$FIXTURES_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
            clone --depth 1 https://github.com/diegoami/ic2-test-fixtures.git "$dir"
          test -f "$dir/Imperial Conquest 2.dat"
          echo "IC2_FIXTURES_DIR=$dir" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test IC2.sln --no-build --configuration Release --logger "console;verbosity=detailed"
