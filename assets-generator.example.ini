; T51's prompt-driven asset generator: the local config's SHAPE.
;
; Copy this file to assets-generator.local.ini (which .gitignore excludes - never
; commit it, never paste its api_key anywhere) and fill it in there. The generator
; reads assets-generator.local.ini from the repository root, or takes the key from
; the OPENROUTER_API_KEY environment variable instead.
;
; The provider is NOT hardcoded in the generator: it is named here. The default
; endpoint below is OpenRouter (https://openrouter.ai), an OpenAI-compatible API;
; image output comes from an image-capable model through chat completions with
; modalities ["image", "text"], and the image returns as a base64 data URL in the
; assistant message's images field. Run the generator's dry run to list the
; image-output models OpenRouter currently offers, with their published prices,
; then pick one:
;
;   python scripts/generate-authored-assets.py
;
; The generator never prints or logs the api_key, and never echoes request
; headers. A dry run needs no key at all; a real run refuses to start without one.

[openrouter]
; The OpenAI-compatible base URL of the provider.
endpoint = https://openrouter.ai/api/v1

; The image-output model to generate with, e.g. one of the models the dry run
; lists (OpenRouter's image-output models change over time - pick from the live
; list, not from a comment). Left empty on purpose: the user fills this in.
model =

; The secret API key. Left empty on purpose - fill it in the LOCAL copy only.
api_key =
